<div class="login-page">

    <div class="login-card">

        <div class="logo">
            LP
        </div>

        <h1>Los Pastos</h1>

        <p class="subtitle">
            Panel Administrativo
        </p>

        <div class="notice">
            Vista preliminar del módulo de acceso.
        </div>

        <form>

            <label>
                Correo electrónico
            </label>

            <input
                type="email"
                placeholder="usuario@correo.com"
            >


            <label>
                Contraseña
            </label>

            <input
                type="password"
                placeholder="••••••••"
            >


            <a
                class="login-button"
                routerLink="/dashboard"
            >
                Ingresar
            </a>

        </form>

        <small>
            Autenticación pendiente de integración.
        </small>

    </div>

</div>
