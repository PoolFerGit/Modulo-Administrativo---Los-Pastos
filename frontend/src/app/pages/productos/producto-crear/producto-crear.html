<h1>Registrar producto</h1>

<div class="form-card">

    <label>Nombre</label>
    <input type="text">

    <label>Descripción</label>
    <textarea></textarea>

    <label>Precio</label>
    <input type="number">

    <label>Categoría</label>

    <select>
        <option>Seleccione una categoría</option>
        <option>Escolar</option>
        <option>Trabajo</option>
        <option>Deportivo</option>
    </select>

    <label>Tipo de producto</label>

    <select>
        <option>PRENDA</option>
        <option>TELA</option>
    </select>

    <label>
        <input type="checkbox">
        Producto destacado
    </label>

    <button type="button">
        Guardar producto
    </button>

</div>
