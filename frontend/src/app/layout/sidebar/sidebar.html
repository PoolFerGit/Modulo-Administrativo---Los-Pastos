<aside class="sidebar">


    <div class="brand">

        <div class="brand-logo">
            LP
        </div>

        <div>

            <strong>
                Los Pastos
            </strong>

            <span>
                Administración
            </span>

        </div>

    </div>


    <div class="rol-prueba">

        <label>
            Rol de prueba
        </label>

        <select
            [value]="permisos.rolActual()"
            (change)="cambiarRol($event)"
        >

            <option value="ADMIN">
                Administrador
            </option>

            <option value="DEVELOPER">
                Desarrollador
            </option>

            <option value="EDITOR">
                Editor
            </option>

        </select>

    </div>


    <nav class="menu">


        <a
            routerLink="/dashboard"
            routerLinkActive="active"
        >
            Dashboard
        </a>


        <a
            routerLink="/productos"
            routerLinkActive="active"
        >
            Productos
        </a>


        @if (
            permisos.puedeVerUsuarios()
        ) {

            <a
                routerLink="/usuarios"
                routerLinkActive="active"
            >
                Usuarios
            </a>

        }

    </nav>


    <div class="sidebar-footer">

        <a routerLink="/login">

            Cerrar sesión

        </a>

    </div>


</aside>
